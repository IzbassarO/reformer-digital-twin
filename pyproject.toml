[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdt"
version = "0.1.0"
description = "Physics-informed digital twin of an industrial steam methane reformer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Izbassar Orynbassarov" }]
dependencies = [
    "cantera",
    "coolprop",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
