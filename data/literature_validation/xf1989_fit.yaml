compared_on: digitised z grid of each curve (model interpolated linearly onto it)
leva_grummer:
  description: Leva-Grummer bed-side coefficient (Latham 2011 Eq. 20), all 5.168 kmol/h fed as CH4, Latham inlet rule
  objective_definition: 'least_squares (scipy, trf, bounded) on residuals r_c(z_k) = (model - data)/(max(data_c) - min(data_c))/sqrt(n_c)
    for each compared curve c on its digitised grid; stage A: c in {p_t}, parameters voidage in [0.35, 0.60], d_p in [4, 12] mm; stage
    B: c in {x_CH4, T_gas}, parameter m in [0.2, 2.0] with eta_1 = eta_2 = eta_3 = 0.1 m, stage-A values fixed'
