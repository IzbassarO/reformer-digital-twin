# Latham, McAuley, Peppley & Raybold (2011): industrial top-fired SMR, validation cases
#
# Source: Fuel Processing Technology 92(8), 1574-1586. doi:10.1016/j.fuproc.2011.04.001
#         BibTeX key: latham2011. Local copy: literature/ (Fuel Processing Technology ... .pdf),
#         PDF page n = journal page 1573 + n.
# Companion: Latham (2008) M.Sc.E. thesis, key latham2008, literature/latham2008_msce_thesis.pdf,
#         summarised in paper/notes/latham2008_thesis.md.
# Transcribed 2026-09-04. Values not in the source are null with a comment.
#
# !!! IMPORTANT: every tube-wall temperature in this paper is SHIFTED by an undisclosed constant.
#     See temperature_shift_warning. The thesis (Appendix H) gives absolute values; see cross_check.

metadata:
  citation_key: latham2011
  doi: 10.1016/j.fuproc.2011.04.001
  page_convention: "journal pages 1574-1586; PDF page = journal page - 1573"

temperature_shift_warning:
  page: 1579
  quote: >
    "All temperatures in the publication have been vertically shifted to show the shape of the
    temperature profiles without indicating the true value of the temperatures."
  consequence: >
    Tables 5 and 9 and all temperature profiles in Figs. 7-15 are relative, not absolute. The
    shift constant is not disclosed. Outlet-temperature DIFFERENCES (Table 10) are unaffected.

# ---------------------------------------------------------------------------
# Reformer description
# ---------------------------------------------------------------------------
reformer:
  table1_specifications:
    source: "Table 1, p. 1576"
    maximum_plant_rate_Nm3_per_h_H2: 112000
    steam_to_carbon_ratio_range: [2.7, 3.0]
    process_side_feed: "Natural gas"
    catalyst_type: "NiO2 on Al2O3 support"    # as printed ("NiO 2 on Al 2O3")
    number_of_tubes: 336
    tubes_per_row: 48
    number_of_burners: 96
    burners_per_row: 12
  furnace_description:
    source: "p. 1574 (Introduction) and p. 1577"
    type: "top-fired, co-current 'box' reformer"
    tube_rows: 7
    burner_rows: 8
    burner_location: "ceiling of the furnace"
    inlet_temperature_C_approx: 600       # "a temperature near 600 degC" (p. 1574)
    inlet_pressure_kPa_approx: 2700       # "a pressure of 2700 kPa" (p. 1574)
    flame_length: "less than half the height of the furnace" # p. 1574
    flue_gas_tunnels: "rectangular protrusions on the floor between tube rows with side openings (p. 1574)"
    vertical_sections: "15 sections: 10 in the top half, 5 in the bottom half (p. 1579); 226 equations (p. 1582)"
    tube_outer_diameter_m: null           # not in the paper; thesis p. 6 gives 14.6 cm (see cross_check)
    tube_inner_diameter_m: null           # not in paper or thesis
    tube_wall_thickness_m: null           # not in paper or thesis
    heated_length_m: null                 # not in the paper; thesis p. 6 gives 12.5 m (see cross_check)
    elevation_normalisation: "measurement elevations quoted as fractions 0.29 and 0.68 of the tube length from the top (Tables 5, 9)"

