    source: "p. 1579, Fig. 7 with Table 4 initial guesses"
    upper_TWT_sim_minus_meas_C: 113
    lower_TWT_sim_minus_meas_C: 28
    process_gas_outlet_C: 7
    furnace_gas_outlet_C: 26

# ---------------------------------------------------------------------------
# Tables 4 and 6: adjustable parameters
# ---------------------------------------------------------------------------
adjustable_parameters:
  source: "Table 4, p. 1579 (initial guess, standard deviation, bounds) and Table 6, p. 1582 (best fit)"
  fitting_data: "four data sets at 99 %, 94 %, 91 % and 75 % of maximum rate (p. 1579); reconciled by the industrial sponsor; 'provided in a recent thesis [29]'"
  method: "multivariate Levenberg-Marquardt, objective Eq. (21), p. 1582"
  Lq:        {initial: 0.29, std: 0.14, bounds: "0.29 <= Lq <= 0.48 (scaled length, visible flame range)", best_fit: 0.48, description: "heat-release (flame) length, fraction of furnace height", note: "best fit at upper bound; not extended for lack of data (p. 1582)"}
  alpha_top: {initial: 0.18, std: 0.18, bounds: "parabola opens down, heat release >= 0 in each zone", best_fit: 0.182, description: "fraction of combustion heat released in top furnace zone"}
  f_htg:     {initial: 1, std: 1, bounds: "f_htg >= 0", best_fit: 1.68, description: "multiplier on Leva-Grummer tube-to-process-gas h, Eq. (20)"}
  phi:       {initial: 0.7, std: 0.1, bounds: "0.5 <= phi <= 1.0", best_fit: 0.607, description: "catalyst bed porosity"}
  f_prx:     {initial: 1, std: 1, bounds: "f_prx >= 0", best_fit: 0.20, description: "multiplier on Xu-Froment rates of reactions (1) and (2) for catalyst activity"}
  f_nOffGas: {initial: 0.9, std: 0.1, bounds: "0.90 <= f <= 1.10", best_fit: 0.963, description: "multiplier on PSA off-gas flow to furnace"}
  f_nCombAir: {initial: 0.9, std: 0.1, bounds: "0.90 <= f <= 1.10", best_fit: 1.05, description: "multiplier on combustion air flow"}
  f_ctube:   {initial: 1.0, std: 0.8, bounds: "f_ctube >= 0", best_fit: 0.38, description: "multiplier on furnace-gas-to-tube convective h"}
  flow_uncertainty_note: "reconciled off-gas and air flows have an estimated uncertainty of approximately 10 % (p. 1580)"

# ---------------------------------------------------------------------------
# Model assumptions to reuse
# ---------------------------------------------------------------------------
model_assumptions:
  kinetics: "Xu & Froment [30] rates (p. 1578); rates of CH4-consuming reactions (1) and (2) multiplied by f_prx (p. 1578)"
  effectiveness_factors:
    source: "p. 1578"
    default: 0.1
    top_section: 0.05
    quote: "The effectiveness factors for the reforming reactions and the water-gas shift are assumed to be 0.1, except in the top tube section where the effectiveness factors are set to 0.05 to reduce the rate of the reforming reactions [28]."
  pseudo_homogeneous: "catalyst and process gas at the same temperature; uniform T, P, X within a section (p. 1578)"
  tube_to_process_gas_heat_transfer:
    source: "Eq. (20), p. 1578; Leva & Grummer [27]"
    equation: "h_tg = f_htg * 0.813 * (lambda_pg / (2 r_in)) * exp(-3 D_p / r_in) * (D_p G_s / mu_pg)^0.9,   Re = D_p G_s / mu_pg"
  pressure_drop:
    source: "Eq. (14), p. 1578 (Ergun-type)"
    equation: "0 = P_seg_abv - P_seg - f * rho_pg * v_s^2 / D_p * dy / 1000,   f = (1-phi)/phi^3 * [1.75 + 150 (1-phi)/Re]"
    units_note: "P in kPa (hence /1000); v_s superficial velocity"
  higher_alkane_rule:
    source: "Eqs. (15)-(16), p. 1578"
    equation: "C_k H_(2k+2) + (k-1)/3 H2O -> (k-1)/3 CO + (2k+1)/3 CH4"
    ethane_example: "C2H6 + 1/3 H2O -> 1/3 CO + 5/3 CH4, dH ~ 3.7 kJ/gmol (p. 1578)"
    note: "instantaneous at the top section; no net H2 production or consumption; enthalpy added to the top tube section energy balance"
  emissivities:
    source: "p. 1578"
    tube: 0.85
    refractory: 0.60
  furnace_gas_model: "one clear + three gray gases (Taylor & Foster [23]), CO2/H2O ratio near 1, non-luminous, non-scattering, plug flow; parabolic heat release [21] (p. 1577)"
  furnace_convection: "Dittus-Boelter [24] times f_ctube (p. 1578)"
  exchange_areas: "RADEX Monte Carlo ray tracing [22] (p. 1578)"
  catalyst_life:
    source: "p. 1584"
    quote: "the catalyst is crushed and deactivated over its four year life"
    value_years: 4
  tube_life_rule_of_thumb:
    source: "p. 1576, citing [6] American Petroleum Institute, API Standard 530 (2003)"
    quote: "Reformer tubes are designed with an expected life of 100,000 h. The tube life is very sensitive to changes in operating temperature. A general rule of thumb is that an increase in tube-wall temperature of 20 degC will decrease tube life by half [6]."
    design_life_h: 100000
    delta_T_halving_life_C: 20
  runtime:
    source: "p. 1582"
    equations: 226
    seconds_from_poor_guess: 245
    seconds_from_previous_solution: 60
    hardware: "2.8 GHz processor, 2 GB RAM"
  limitations_stated:
    - "average-tube model; cannot resolve hot tubes caused by recirculation, burner location, flame pattern, uneven tube flow, localised deactivation (p. 1584)"
    - "poorer fit at 75 % capacity; adjustable parameters may be rate specific (pp. 1582, 1584)"
    - "3:1 ratio of high-rate to low-rate fitting data biases the fit to high rates (p. 1582)"

# ---------------------------------------------------------------------------
# Cross-check against the 2008 thesis (Appendix H, Tables 29-31, pp. 239-242)
# ---------------------------------------------------------------------------
cross_check_with_thesis:
  thesis_source: "Latham (2008) M.Sc.E. thesis, Appendix H, Table 29 (pp. 239-241), Table 30 (p. 241), Table 31 (p. 242); PDF pages 262-265"
  do_thesis_inlet_states_match_paper_table8: false
  explanation: >
    No. Table 8 of the paper contains the two NEW validation sets (99 % and 75 %, p. 1582), which are
    not in the thesis. The thesis Table 30 process inlet states are: Plant A 7886 kmol/h, 611.4 degC,
    3006.0 kPa; Plant B 7073 kmol/h, 613.9 degC, 2944.0 kPa; Plant C1 9654 kmol/h, 617.8 degC,
    3026.7 kPa; Plant C2 5355 kmol/h, 606.7 degC, 2808.5 kPa. Paper Table 8 has 7381 kmol/h,
    604 degC, 3013 kPa (99 %) and 5487 kmol/h, 591 degC, 2770 kPa (75 %). None coincide.
    The paper's FOUR FITTING sets are stated to be in the thesis (p. 1579, "[29]") at plant rates
    99/94/91/75 %, whereas the thesis (p. 125) quotes 99/92/96/71 % for Plants A/B/C1/C2.
  are_thesis_temperatures_absolute: true
  evidence:
    - "The thesis nowhere states that temperatures are shifted; the word 'shift' occurs only for the water-gas shift and for qualitative profile movements (pp. 108, 112-113)."
    - "Thesis Table 31 (p. 242) values are physically plausible absolutes: T_proc,out 832.4-848.9 degC, T_upper 802.5-838.0 degC, T_lower 853.1-878.4 degC, T_fur,out 940.9-1012.3 degC."
    - "Paper Table 7 reveals one absolute: measured wet H2 outlet 46.3 mol% at 91 % rate. Thesis Table 31 Plant B has X_H2,proc,out = 0.463134, i.e. 46.3 %. So paper '91 %' = thesis Plant B (thesis calls it 92 %)."
    - "Elevation differences agree: paper 91 % case 333-284 = 49 degC vs thesis Plant B 857.7-809.2 = 48.5 degC; paper 75 % fitting case 328-278 = 50 degC vs thesis Plant C2 853.1-802.5 = 50.6 degC."
    - "Implied shift constant (thesis minus paper): Plant B upper 809.2-284 = 525.2, lower 857.7-333 = 524.7; Plant C2 upper 802.5-278 = 524.5, lower 853.1-328 = 525.1 degC. A single constant of ~525 degC reconciles all four numbers, consistent with a uniform vertical shift of absolute data."
  decision: >
    Absolute tube-wall temperature validation IS possible using the thesis Appendix H data
    (Plants A, B, C1, C2: two elevations each, 3.66 m and 8.53 m from the top, thesis p. 9) but
    NOT using the paper's Tables 5 and 9. The paper's 99 % and 75 % validation sets (Table 8) have
    no absolute temperatures anywhere.
  thesis_geometry_for_reuse:
    tube_outer_diameter_m: 0.146          # thesis p. 6
    heated_length_m: 12.5                 # thesis p. 6 ("exposed length")
    equivalent_particle_diameter_m: 0.00540   # thesis Table 17, p. 93 (Twigg 1989)
    catalyst_packing_density_kg_per_m3: 1100  # thesis Table 17, p. 94 (Katalco 23-4Q)
    tube_thermal_conductivity_W_per_m_K: 29.6 # thesis Table 17, p. 93: 106 500 J/(m h K)
    tube_wall_thickness_m: null
    wall_thickness_comment: >
      Not given anywhere in the thesis or the paper (only r_in, r_out symbols). Documented
      reference value from Xu & Froment Part II Table 2 (p. 100): ID 0.1016 m, OD 0.1322 m,
      i.e. wall = 0.0153 m (~15 mm), for a similar-size industrial tube. Must be confirmed
      with the chemical engineer before use.
    peep_hole_elevations_m: [3.66, 8.53]  # thesis p. 9 (upper, lower)
    peep_hole_elevation_fractions_derived: [0.293, 0.682]  # 3.66/12.5, 8.53/12.5 - match the paper's 0.29 and 0.68
