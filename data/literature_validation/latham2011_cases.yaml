      quote: "H2  -0.5 (i.e 45.8-46.3)"
      wet_H2_outlet_measured_mol_pct: 46.3
      wet_H2_outlet_simulated_mol_pct: 45.8
      case: "91 % plant rate"
    also_stated: "process-gas outlet temperature differs by 7 degC in the 75 % fitting case (p. 1582)"
