  digitisation:
    method: 'pixel extraction from the Fig. 3 JPEG embedded in the PDF (781x499 px): blue-mask for the average curve, dark-mask
      below it for the minimum curve; axis calibration LMP 30-41 linear (checked against the 900/1000/1100 degC guide lines
      for 1e5 h: 32.80/35.60/38.39), stress log10 2-100 MPa (checked against the 10 and 30 MPa gridlines)'
    estimated_accuracy: about +/-3 % in stress, +/-0.05 in LMP
    TODO: replace by a WebPlotDigitizer export of Fig. 3 or by the Manoir Manaurite XM data sheet (https://www.rmg.co.id/MANAURITEXM.pdf,
      Yeh ref. [34]); points at t_r = 1e5 h are a representation of the master curve, not measured rupture tests
design_life_assumptions:
  design_temperature_C: 925
  design_pressure_kg_per_cm2: 24
  design_pressure_MPa: 2.354
  hoop_stress_formula: S = 0.5 P D_o / t (thin wall on outer diameter), Yeh Eq. 16 p. 10
  hoop_stress_MPa: 11.9
  design_life_h: 5000000.0
  design_life_years: 570
  note: 'Yeh p. 11: design life ~5e6 h ''evaluated on the basis of design operating conditions which have taken a safety factor
    into account''; simulated lives from maximum tube temperatures give ~4 years for upstream tubes (p. 11); industry design
    basis is 100 000 h (Latham 2008 p. 1)'
  source: Yeh 2021 pp. 10-11
tube_dimensions:
  outer_diameter_mm: 136
  wall_thickness_mm: 13.4
  source: Yeh 2021 p. 5
checks:
  design_anchor_LMP: 35.536
  minimum_curve_stress_at_anchor_MPa: 25.9
  average_curve_stress_at_anchor_MPa: 29.23
